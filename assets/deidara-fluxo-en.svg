<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="How Deidara works: recipe, catalog, draft, validate, prototype, approval and generate"><style>
.s{font-family:'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif} .m{font-family:Consolas, 'JetBrains Mono', Menlo, ui-monospace, monospace}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes burst{0%,100%{transform:scale(.92)}50%{transform:scale(1.06)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes stamp{0%,40%{opacity:0;transform:rotate(-12deg) scale(1.6)}55%,100%{opacity:1;transform:rotate(-12deg) scale(1)}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.burst{transform-box:fill-box;transform-origin:center;animation:burst 2.6s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.2s ease-out both}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp 3s ease-out both}
@media (prefers-reduced-motion:reduce){.pulse,.burst,.bar,.stamp{animation:none}}
</style><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1E2A44" stroke-width="1" opacity=".55"/></pattern><radialGradient id="glow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".16"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="640" fill="#0B1220"/><rect width="1280" height="640" fill="url(#g)"/><rect width="1280" height="640" fill="url(#glow)"/><text x="640" y="58" text-anchor="middle" class="s" font-size="30" font-weight="800" fill="#E2E8F0">How it works</text><rect x="37" y="92" width="1206" height="82" rx="14" fill="#0E1A2E" stroke="#60A5FA" stroke-opacity=".4"/><text x="62" y="126" class="s" font-size="15" font-weight="700" fill="#60A5FA">AT YOUR SOURCE (Deidara connects to nothing)</text><text x="62" y="154" class="s" font-size="17" fill="#E2E8F0">SQL Server · Power BI model · Excel · SharePoint · CSV · API</text><text x="1218" y="140" text-anchor="end" class="s" font-size="15" fill="#94A3B8">someone with access runs the recipe and pastes the result</text><rect x="37" y="252" width="150" height="118" rx="14" fill="#111A2E" stroke="#60A5FA" stroke-opacity=".55"/><circle cx="63" cy="280" r="14" fill="#60A5FA" opacity=".18"/><text x="63" y="285" text-anchor="middle" class="s" font-size="14" font-weight="800" fill="#60A5FA">1</text><text x="53" y="324" class="s" font-size="18" font-weight="700" fill="#E2E8F0">Recipe</text><text x="53" y="348" class="m" font-size="13" fill="#94A3B8">SQL · DAX · M</text><path d="M190 311 L210 311" stroke="#475569" stroke-width="2"/><path d="M201.0 315.3 L210 311 L201.0 306.7" fill="none" stroke="#475569" stroke-width="2"/><rect x="213" y="252" width="150" height="118" rx="14" fill="#111A2E" stroke="#60A5FA" stroke-opacity=".55"/><circle cx="239" cy="280" r="14" fill="#60A5FA" opacity=".18"/><text x="239" y="285" text-anchor="middle" class="s" font-size="14" font-weight="800" fill="#60A5FA">2</text><text x="229" y="324" class="s" font-size="18" font-weight="700" fill="#E2E8F0">Catalog</text><text x="229" y="348" class="m" font-size="13" fill="#94A3B8">catalogar</text><path d="M366 311 L386 311" stroke="#475569" stroke-width="2"/><path d="M377.0 315.3 L386 311 L377.0 306.7" fill="none" stroke="#475569" stroke-width="2"/><rect x="389" y="252" width="150" height="118" rx="14" fill="#111A2E" stroke="#F59E0B" stroke-opacity=".55"/><circle cx="415" cy="280" r="14" fill="#F59E0B" opacity=".18"/><text x="415" y="285" text-anchor="middle" class="s" font-size="14" font-weight="800" fill="#F59E0B">3</text><text x="405" y="324" class="s" font-size="18" font-weight="700" fill="#E2E8F0">Draft</text><text x="405" y="348" class="m" font-size="13" fill="#94A3B8">argila.json</text><path d="M542 311 L562 311" stroke="#475569" stroke-width="2"/><path d="M553.0 315.3 L562 311 L553.0 306.7" fill="none" stroke="#475569" stroke-width="2"/><rect x="565" y="252" width="150" height="118" rx="14" fill="#111A2E" stroke="#F59E0B" stroke-opacity=".55"/><circle cx="591" cy="280" r="14" fill="#F59E0B" opacity=".18"/><text x="591" y="285" text-anchor="middle" class="s" font-size="14" font-weight="800" fill="#F59E0B">4</text><text x="581" y="324" class="s" font-size="18" font-weight="700" fill="#E2E8F0">Validate</text><text x="581" y="348" class="m" font-size="13" fill="#94A3B8">names, functions</text><path d="M718 311 L738 311" stroke="#475569" stroke-width="2"/><path d="M729.0 315.3 L738 311 L729.0 306.7" fill="none" stroke="#475569" stroke-width="2"/><rect x="741" y="252" width="150" height="118" rx="14" fill="#111A2E" stroke="#FB923C" stroke-opacity=".55"/><circle cx="767" cy="280" r="14" fill="#FB923C" opacity=".18"/><text x="767" y="285" text-anchor="middle" class="s" font-size="14" font-weight="800" fill="#FB923C">5</text><text x="757" y="324" class="s" font-size="18" font-weight="700" fill="#E2E8F0">Prototype</text><text x="757" y="348" class="m" font-size="13" fill="#94A3B8">fictional HTML</text><path d="M894 311 L914 311" stroke="#475569" stroke-width="2"/><path d="M905.0 315.3 L914 311 L905.0 306.7" fill="none" stroke="#475569" stroke-width="2"/><rect x="917" y="252" width="150" height="118" rx="14" fill="#111A2E" stroke="#34D399" stroke-opacity=".55"/><circle cx="943" cy="280" r="14" fill="#34D399" opacity=".18"/><text x="943" y="285" text-anchor="middle" class="s" font-size="14" font-weight="800" fill="#34D399">6</text><text x="933" y="324" class="s" font-size="18" font-weight="700" fill="#E2E8F0">Approval</text><text x="933" y="348" class="m" font-size="13" fill="#94A3B8">aprovar --por</text><path d="M1070 311 L1090 311" stroke="#475569" stroke-width="2"/><path d="M1081.0 315.3 L1090 311 L1081.0 306.7" fill="none" stroke="#475569" stroke-width="2"/><rect x="1093" y="252" width="150" height="118" rx="14" fill="#111A2E" stroke="#34D399" stroke-opacity=".55"/><circle cx="1119" cy="280" r="14" fill="#34D399" opacity=".18"/><text x="1119" y="285" text-anchor="middle" class="s" font-size="14" font-weight="800" fill="#34D399">7</text><text x="1109" y="324" class="s" font-size="18" font-weight="700" fill="#E2E8F0">Katsu!</text><text x="1109" y="348" class="m" font-size="13" fill="#94A3B8">.pbip + SQL</text><path d="M87 248 L87 178" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 6"/><path d="M91.3 187.0 L87 178 L82.7 187.0" fill="none" stroke="#F59E0B" stroke-width="2"/><text x="97" y="214" class="s" font-size="13" font-weight="600" fill="#F59E0B">recipe</text><path d="M263 178 L263 248" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6 6"/><path d="M258.7 239.0 L263 248 L267.3 239.0" fill="none" stroke="#60A5FA" stroke-width="2"/><text x="273" y="232" class="s" font-size="13" font-weight="600" fill="#60A5FA">only structure returns</text><path d="M992 374 V398 H464 V378" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 6"/><path d="M457 386 L464 376 L471 386" fill="none" stroke="#475569" stroke-width="2"/><text x="728.0" y="417" text-anchor="middle" class="s" font-size="13" fill="#94A3B8">changed after approval? new prototype, new "yes"</text><rect x="37" y="452" width="394" height="150" rx="14" fill="#0D1526" stroke="#F59E0B" stroke-opacity=".35"/><text x="55" y="484" class="s" font-size="16" font-weight="700" fill="#F59E0B">Nothing is guessed</text><text x="55" y="514" class="s" font-size="14" fill="#E2E8F0">names: source catalog · functions: dictionary</text><text x="55" y="538" class="s" font-size="14" fill="#E2E8F0">links: proven, or confirmed by a person</text><text x="55" y="562" class="s" font-size="14" fill="#E2E8F0">errors say what exists and how to fix it</text><text x="55" y="586" class="s" font-size="14" fill="#E2E8F0">warnings become business decisions</text><rect x="443" y="452" width="394" height="150" rx="14" fill="#0D1526" stroke="#FB923C" stroke-opacity=".35"/><text x="461" y="484" class="s" font-size="16" font-weight="700" fill="#FB923C">The manager decides</text><text x="461" y="514" class="s" font-size="14" fill="#E2E8F0">fictional, consistent numbers</text><text x="461" y="538" class="s" font-size="14" fill="#E2E8F0">ⓘ on every visual: what the number means</text><text x="461" y="562" class="s" font-size="14" fill="#E2E8F0">"For approval" tab with a checklist</text><text x="461" y="586" class="s" font-size="14" fill="#E2E8F0">approval summary with a code</text><rect x="849" y="452" width="394" height="150" rx="14" fill="#0D1526" stroke="#34D399" stroke-opacity=".35"/><text x="867" y="484" class="s" font-size="16" font-weight="700" fill="#34D399">Complete delivery</text><text x="867" y="514" class="s" font-size="14" fill="#E2E8F0">.pbip project (TMDL + PBIR) → .pbix in Desktop</text><text x="867" y="538" class="s" font-size="14" fill="#E2E8F0">SQL views, reconciliation, quality</text><text x="867" y="562" class="s" font-size="14" fill="#E2E8F0">sign-off sheet, KPI dictionary</text><text x="867" y="586" class="s" font-size="14" fill="#E2E8F0">the team's Memory Card</text></svg>
